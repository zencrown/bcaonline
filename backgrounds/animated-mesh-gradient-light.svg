<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="meshBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="90" />
    </filter>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6E3EF0" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#6E3EF0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12B888" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#12B888" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2B8FEF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2B8FEF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blob4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E356B8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#E356B8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blob5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A62E8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#4A62E8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- light base background -->
  <rect x="0" y="0" width="1600" height="900" fill="#F7F7FB" />

  <g filter="url(#meshBlur)">

    <!-- Blob 1 -->
    <circle r="400" fill="url(#blob1)">
      <animate attributeName="cx"
        values="200;500;250;600;200"
        dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy"
        values="200;150;550;500;200"
        dur="12s" repeatCount="indefinite" />
    </circle>

    <!-- Blob 2 -->
    <circle r="440" fill="url(#blob2)">
      <animate attributeName="cx"
        values="1300;900;1400;1000;1300"
        dur="11s" repeatCount="indefinite" />
      <animate attributeName="cy"
        values="200;500;700;300;200"
        dur="9s" repeatCount="indefinite" />
    </circle>

    <!-- Blob 3 -->
    <circle r="380" fill="url(#blob3)">
      <animate attributeName="cx"
        values="800;1100;500;800;800"
        dur="13s" repeatCount="indefinite" />
      <animate attributeName="cy"
        values="700;400;300;700;700"
        dur="10.5s" repeatCount="indefinite" />
    </circle>

    <!-- Blob 4 -->
    <circle r="360" fill="url(#blob4)">
      <animate attributeName="cx"
        values="500;200;900;600;500"
        dur="9.5s" repeatCount="indefinite" />
      <animate attributeName="cy"
        values="750;500;200;750;750"
        dur="11.5s" repeatCount="indefinite" />
    </circle>

    <!-- Blob 5 -->
    <circle r="420" fill="url(#blob5)">
      <animate attributeName="cx"
        values="1100;1400;700;1200;1100"
        dur="12.5s" repeatCount="indefinite" />
      <animate attributeName="cy"
        values="450;150;600;450;450"
        dur="8.5s" repeatCount="indefinite" />
    </circle>

  </g>
</svg>
