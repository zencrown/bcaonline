<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000"
     role="img" aria-labelledby="t" aria-label="Three layered gradient waves gently moving in parallax" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Three layered violet-to-cyan waves, animated (light theme)</title>

  <defs>
    <!-- Background: soft light vertical gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>

    <!-- Wave fills: 1000px-wide repeating gradients so the horizontal loop is seamless.
         EDIT COLORS HERE: #7C3AED = violet, #0891B2 = cyan (slightly deeper for contrast on light) -->
    <linearGradient id="gA" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
      <stop offset="0"   stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#0891B2"/>
      <stop offset="1"   stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
      <stop offset="0"   stop-color="#0891B2"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1"   stop-color="#0891B2"/>
    </linearGradient>

    <!-- 4-point sparkle centered on 0,0 -->
    <path id="sp" d="M0-10Q1.5-1.5 10 0Q1.5 1.5 0 10Q-1.5 1.5-10 0Q-1.5-1.5 0-10Z"/>
  </defs>

  <style>
    /* Horizontal scroll = linear (constant speed) so the loop never stutters.
       Each path is 2000 wide with a 1000 period, so moving exactly 1000 loops perfectly. */
    @keyframes toRight { from { transform: translateX(-1000px); } to { transform: translateX(0); } }
    @keyframes toLeft  { from { transform: translateX(0); }       to { transform: translateX(-1000px); } }
    /* Soft vertical bob with easing, adds a calm breathing feel */
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-16px); } }

    .bob  { animation: bob ease-in-out infinite alternate; }
    .back.bob  { animation-duration: 8s; }
    .mid.bob   { animation-duration: 6.5s; }
    .front.bob { animation-duration: 5s; }

    .slide { animation-timing-function: linear; animation-iteration-count: infinite; }
    .back  .slide { animation-name: toRight; animation-duration: 12s; } /* slowest, right */
    .mid   .slide { animation-name: toLeft;  animation-duration: 9s; }  /* medium,  left  */
    .front .slide { animation-name: toRight; animation-duration: 6s; }  /* fastest, right */


    /* Stars: eased fade/scale twinkle, staggered per element */
    @keyframes tw { 0%,100% { opacity: .15; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes tn { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    .tw { opacity: .85; animation: tw var(--d,4s) ease-in-out var(--l,0s) infinite; }
    .tn { opacity: .7;  animation: tn var(--d,4s) ease-in-out var(--l,0s) infinite; }

    /* Accessibility: stop all motion when the user asks for it */
    @media (prefers-reduced-motion: reduce) {
      .bob, .slide, .tw, .tn { animation: none !important; }
    }
  </style>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- STARS: sparkles scale + fade, dots twinkle. Staggered per element via CSS variables for duration and delay -->
  <g>
    <g transform="translate(150 120) scale(1.2)" fill="#7C3AED"><use href="#sp" class="tw" style="--d:3.5s;--l:-0.0s"/></g>
    <g transform="translate(420 70) scale(0.9)" fill="#0891B2"><use href="#sp" class="tw" style="--d:4.2s;--l:-1.3s"/></g>
    <g transform="translate(700 150) scale(1.4)" fill="#7C3AED"><use href="#sp" class="tw" style="--d:4.9s;--l:-2.6s"/></g>
    <g transform="translate(880 90) scale(1.0)" fill="#0891B2"><use href="#sp" class="tw" style="--d:5.6s;--l:-3.9s"/></g>
    <g transform="translate(300 300) scale(0.8)" fill="#7C3AED"><use href="#sp" class="tw" style="--d:6.3s;--l:-1.2s"/></g>
    <g transform="translate(590 260) scale(1.1)" fill="#0891B2"><use href="#sp" class="tw" style="--d:4.0s;--l:-2.5s"/></g>
    <g transform="translate(820 330) scale(0.9)" fill="#7C3AED"><use href="#sp" class="tw" style="--d:4.7s;--l:-3.8s"/></g>
    <g transform="translate(90 380) scale(0.9)" fill="#0891B2"><use href="#sp" class="tw" style="--d:5.4s;--l:-1.1s"/></g>
    <circle cx="60" cy="60" r="1.6" fill="#6366F1" class="tn" style="--d:2.5s;--l:-0.0s"/>
    <circle cx="230" cy="200" r="1.2" fill="#6366F1" class="tn" style="--d:3.4s;--l:-0.8s"/>
    <circle cx="340" cy="140" r="1.5" fill="#6366F1" class="tn" style="--d:4.3s;--l:-1.6s"/>
    <circle cx="500" cy="180" r="1.2" fill="#6366F1" class="tn" style="--d:5.2s;--l:-2.4s"/>
    <circle cx="540" cy="50" r="1.8" fill="#6366F1" class="tn" style="--d:2.6s;--l:-3.2s"/>
    <circle cx="640" cy="60" r="1.3" fill="#6366F1" class="tn" style="--d:3.5s;--l:-4.0s"/>
    <circle cx="770" cy="40" r="1.5" fill="#6366F1" class="tn" style="--d:4.4s;--l:-4.8s"/>
    <circle cx="930" cy="210" r="1.6" fill="#6366F1" class="tn" style="--d:5.3s;--l:-0.6s"/>
    <circle cx="960" cy="370" r="1.2" fill="#6366F1" class="tn" style="--d:2.7s;--l:-1.4s"/>
    <circle cx="740" cy="290" r="1.3" fill="#6366F1" class="tn" style="--d:3.6s;--l:-2.2s"/>
    <circle cx="450" cy="350" r="1.5" fill="#6366F1" class="tn" style="--d:4.5s;--l:-3.0s"/>
    <circle cx="200" cy="400" r="1.3" fill="#6366F1" class="tn" style="--d:5.4s;--l:-3.8s"/>
    <circle cx="610" cy="380" r="1.2" fill="#6366F1" class="tn" style="--d:2.8s;--l:-4.6s"/>
    <circle cx="120" cy="250" r="1.5" fill="#6366F1" class="tn" style="--d:3.7s;--l:-0.4s"/>
    <circle cx="870" cy="400" r="1.2" fill="#6366F1" class="tn" style="--d:4.6s;--l:-1.2s"/>
    <circle cx="380" cy="230" r="1.4" fill="#6366F1" class="tn" style="--d:5.5s;--l:-2.0s"/>
  </g>

  <!-- BACK wave: lightest, most transparent -->
  <g class="back bob">
    <g class="slide">
      <path fill="url(#gA)" opacity="0.35"
            d="M0 520 Q250 400 500 520 T1000 520 T1500 520 T2000 520 V1100 H0 Z"/>
    </g>
  </g>

  <!-- MIDDLE wave: medium -->
  <g class="mid bob">
    <g class="slide">
      <path fill="url(#gB)" opacity="0.6"
            d="M0 620 Q250 720 500 620 T1000 620 T1500 620 T2000 620 V1100 H0 Z"/>
    </g>
  </g>

  <!-- FRONT wave: strongest, most opaque -->
  <g class="front bob">
    <g class="slide">
      <path fill="url(#gA)" opacity="0.9"
            d="M0 730 Q250 590 500 730 T1000 730 T1500 730 T2000 730 V1100 H0 Z"/>
    </g>
  </g>
</svg>
